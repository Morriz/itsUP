# yaml-language-server: $schema=.teleclaude/schemas/teleclaude-project.schema.json
company: instrukt-ai
business:
  publishes:
  - slug: infra
    trigger: Deploying or changing services on an itsUP deployment — GitOps 
      config, secrets, or container-host operations
  - slug: apps
    trigger: Operating an already-deployed app (Planka boards, ERPNext bench 
      sites) at the application level
checkpoint:
  maintenance: {}
  actions:
    validate:
      run: itsup validate
      evidence:
      - itsup validate
      precedence: 50
  bindings:
  - scope:
      include:
      - lib/**
      - api/**
      - commands/**
      - itsup/**
      - bin/**
      - monitor/**
    actions:
    - log-check
  - scope:
      include:
      - tpl/**
    actions:
    - validate
  - scope:
      include:
      - pyproject.toml
      - uv.lock
    actions:
    - install
agents:
  enabled: false
project_slug: itsup
code:
  enabled: true
docs:
  enabled: true
kind: project
schema_version: 14
project_name: itsUP
description: Docker-based deployment platform
