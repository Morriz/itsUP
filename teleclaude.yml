kind: project
company: instrukt-ai
business:
  publishes:
  - slug: infra
    trigger: Deploying or changing services on an itsUP deployment — GitOps 
      config, secrets, or container-host operations
  - slug: apps
    trigger: Operating an already-deployed app (Planka boards, ERPNext bench 
      sites) at the application level
checkpoint:
  actions:
    validate:
      run: itsup validate
      evidence:
      - itsup validate
      precedence: 50
  bindings:
  # Source roots bind log-check only. A `code` block would also bind `test`,
  # which project/adr/0004-remove-the-test-corpus rules out: itsUP authors no
  # tests and holds no runner. Declaring the scope generically keeps log-check.
  - scope:
      include:
      - lib/**
      - api/**
      - commands/**
      - itsup/**
      - bin/**
      - monitor/**
    actions:
    - log-check
  - scope:
      include:
      - tpl/**
    actions:
    - validate
  - scope:
      include:
      - pyproject.toml
      - uv.lock
    actions:
    - install
project_slug: itsup
